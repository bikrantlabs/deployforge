info:
  name: Create Project
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/deployments/projects"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "cloneUrl":"https://github.com/jstibenpb/nodejs-express-template",
        "projectName":"First Project"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
