info:
  name: List Projects
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/deployments/projects"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
