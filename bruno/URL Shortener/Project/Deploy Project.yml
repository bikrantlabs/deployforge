info:
  name: Deploy Project
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/projects/deploy"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  body:
    type: json
    data: |-
      {
        "project": {
          "projectId": "01a1aa8a-6b15-7097-b0ce-40da924abe1f",
            "projectName": "deployforge-web-iii",
            
            "sourceUrl": "https://github.com/bikrantlabs/deployforge-web.git"
        },
        "envVariables": {
          "NODE_ENV": "production"
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const deploymentId = res.body.data?.deployment?.deploymentId;


        bru.setVar("deploymentId", deploymentId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
